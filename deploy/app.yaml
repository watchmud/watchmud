# WatchMUD server configuration for the container (deploy/compose.yaml).
# serverconfig/config_test.go loads this file, so a typo here fails `make check`
# instead of the deploy.
---

# No file: log to stdout, where docker keeps it and rotates it (see the
# logging: block in compose.yaml).
log:
  level: info

contentPath: /app/content

# 0.0.0.0 so the port docker publishes reaches it. localhost here would be
# the container's own loopback, which nothing outside can reach.
telnet:
  host: 0.0.0.0
  port: 4000

# The same game over TLS, so passwords don't cross the internet in the clear.
# The plain port's banner tells players this port number, so compose.yaml
# publishes it unchanged. The certificate comes from certbot through
# deploy/certbot-hook.sh, and is reloaded on renewal without a restart.
# Set port to 0 to run without TLS; with it set, missing certificates stop
# the server at startup.
tls:
  port: 4443
  cert: /app/certs/fullchain.pem
  key: /app/certs/privkey.pem

# /healthz, for compose.yaml's healthcheck: `watchmud -healthcheck` asks it from
# inside the container, so loopback is enough, and it isn't published.
health:
  host: 127.0.0.1
  port: 4080

# MSSP: what a MUD listing site's crawler is told when it connects. The
# server adds its name, player count (bots not counted), uptime and ports.
# Contact is left out: an address here is published to every crawler.
mssp:
  enabled: true
  hostname: watchmud.com
  website: https://www.watchmud.com

# The uri carries the password, so it isn't here: WATCHMUD_MONGO_URI in the
# environment supplies it (compose.yaml builds it from .env).
mongo:
  database: watchmud
