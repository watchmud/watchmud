# WatchMUD for real players: the game, its mongo, and backups.
#
#   deploy/deploy.sh v1.2.3     # the way to run it, and to move to a new version
#
# See deploy/README.md. The game's image comes from ghcr.io, built by
# .github/workflows/build.yaml; nothing here builds. To build and run one
# locally instead, add deploy/compose.build.yaml. This is separate from the
# docker-compose.yml at the repo root, which is the dev mongo.

services:
  watchmud:
    # WATCHMUD_VERSION is in deploy/.env, written there by deploy.sh
    image: ghcr.io/watchmud/watchmud:${WATCHMUD_VERSION:?run deploy/deploy.sh <version> -- see deploy/README.md}
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      WATCHMUD_MONGO_URI: mongodb://watchmud:${WATCHMUD_DB_PASSWORD:?set it in deploy/.env}@mongo:27017/watchmud?authSource=watchmud
    ports:
      - "${WATCHMUD_PORT:-4000}:4000"
      # TLS. The same number both sides: the plain port's banner tells players
      # the one in app.yaml, so publishing it as anything else would lie.
      - "4443:4443"
    volumes:
      # filled by certbot-hook.sh; see README, "TLS"
      - ./certs:/app/certs:ro
    # Asks /healthz (app.yaml, health:) whether the game loop is still
    # ticking -- the binary does it itself, since distroless has no curl. A
    # wedged world, the listeners still accepting, shows as (unhealthy) in
    # `docker compose ps`; docker doesn't restart it for that, a person does.
    # deploy.sh waits for healthy before the smoke test.
    healthcheck:
      test: ["CMD", "/app/watchmud", "-config", "/app/app.yaml", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    # docker stop waits this long after SIGTERM before SIGKILL. The flush of
    # queued saves gets 10s and the mongo disconnect 5s (cmd/watchmud), so the
    # default of 10s could kill it mid-save.
    stop_grace_period: 30s
    # stdout, rotated: at most 5 files of 20MB.
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  # The bots: always-on characters a program plays, listed under Bots in who.
  # Each is made by hand and flagged on its record first -- README, "Bots".
  # With WATCHMUD_BOTS empty this idles.
  bots:
    image: ghcr.io/watchmud/watchmud:${WATCHMUD_VERSION:?run deploy/deploy.sh <version> -- see deploy/README.md}
    restart: unless-stopped
    depends_on:
      watchmud:
        condition: service_healthy
    entrypoint: ["/app/watchmud-bots", "-addr", "watchmud:4000"]
    environment:
      WATCHMUD_BOTS: ${WATCHMUD_BOTS:-}
      WATCHMUD_WANDERERS: ${WATCHMUD_WANDERERS:-}
      WATCHMUD_BOTS_PASSWORD: ${WATCHMUD_BOTS_PASSWORD:-}
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  mongo:
    image: mongo:8
    restart: unless-stopped
    # WiredTiger's cache, capped rather than left to mongo's own sizing, so
    # its memory is a number chosen for the droplet (1GB, shared with docker
    # and the game) rather than one derived from it. Hundreds of characters
    # fit in a fraction of this. The entrypoint puts "mongod" in front of
    # arguments that start with a dash, so init scripts still run.
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set it in deploy/.env}
      WATCHMUD_DB_PASSWORD: ${WATCHMUD_DB_PASSWORD:?set it in deploy/.env}
    # No ports: published. Only the game and the backup reach it, over the
    # compose network; nothing on the internet can even try a password.
    volumes:
      - mongo-data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  # A dump of the game's database every night into deploy/backups, keeping two
  # weeks. On the same disk as mongo, so it covers mistakes, not the disk
  # dying: copy deploy/backups somewhere else too. See the README.
  backup:
    image: mongo:8
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set it in deploy/.env}
      BACKUP_EVERY_SECONDS: ${BACKUP_EVERY_SECONDS:-86400}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["bash", "/backup.sh"]
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  # The dumps above, copied every hour to a Spaces bucket -- in a different
  # region from the droplet -- so losing the droplet doesn't lose them too.
  # Its own service so that a failed upload can't get in the way of taking
  # the dump, and adding it restarts nothing else.
  offsite:
    image: rclone/rclone:1.75
    restart: unless-stopped
    environment:
      # the rclone remote "spaces", configured entirely from the environment;
      # no config file, or rclone says so on every pass
      RCLONE_CONFIG: /dev/null
      RCLONE_CONFIG_SPACES_TYPE: s3
      RCLONE_CONFIG_SPACES_PROVIDER: DigitalOcean
      RCLONE_CONFIG_SPACES_ENDPOINT: ${SPACES_REGION:?set it in deploy/.env}.digitaloceanspaces.com
      RCLONE_CONFIG_SPACES_ACCESS_KEY_ID: ${SPACES_KEY:?set it in deploy/.env}
      RCLONE_CONFIG_SPACES_SECRET_ACCESS_KEY: ${SPACES_SECRET:?set it in deploy/.env}
      SPACES_BUCKET: ${SPACES_BUCKET:?set it in deploy/.env}
      OFFSITE_EVERY_SECONDS: ${OFFSITE_EVERY_SECONDS:-3600}
      OFFSITE_KEEP_DAYS: ${OFFSITE_KEEP_DAYS:-90}
    volumes:
      - ./backups:/backups:ro
      - ./offsite.sh:/offsite.sh:ro
    entrypoint: ["sh", "/offsite.sh"]
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

volumes:
  mongo-data:
