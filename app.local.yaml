# An example Configuration file for starting the WatchMUD server locally
---

# where the log is written to
log:
  file: ./bin/watchmud-server.log
  level: debug

# Content Configuration
contentPath: ./content

# Telnet listener
telnet:
  host: localhost
  port: 4000

# /healthz: 200 while the game loop is ticking. `curl localhost:4080/healthz`
health:
  host: localhost
  port: 4080

# Persistence. Characters are stored one document per character in mongo.
# `make db-up` starts the one in docker-compose.yml -- on port 27018, so it
# doesn't collide with a mongo already installed on this machine. Comment the uri out (or
# leave it empty) to run with the in-memory store instead, where nothing
# survives a restart.
mongo:
  uri: mongodb://localhost:27018
  database: watchmud
